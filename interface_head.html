<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jumeau num&eacute;rique &mdash; RUL 4 features (vibration brute)</title>
<style>
:root{--bg:#0B1118;--panel:#101A24;--panel2:#0e1720;--line:#1e2b38;--txt:#E6EDF3;--mut:#8B98A5;
--teal:#00C6AE;--blue:#4FC3F7;--amber:#FFB300;--red:#E53935;--green:#4CAF50;--orange:#FB8C00}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--txt)}
header{padding:16px 26px;background:linear-gradient(135deg,#101A24,#122030);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{margin:0;font-size:20px;font-weight:600}
header .sub{color:var(--mut);font-size:12.5px;margin-top:3px}
main{padding:18px 26px 40px}
.page{display:block;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
canvas{max-width:100%}
.btn{background:var(--teal);color:#04241f;border:none;border-radius:12px;padding:16px 22px;font-size:16px;font-weight:700;cursor:pointer;transition:.15s}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.b-green{background:#102b1c;color:var(--green);border:1px solid var(--green)}
.b-orange{background:#2b1c10;color:var(--orange);border:1px solid var(--orange)}
.b-yellow{background:#2b2610;color:var(--amber);border:1px solid var(--amber)}
.b-red{background:#2b1010;color:var(--red);border:1px solid var(--red)}

/* ===== Onglet Jumeau numerique (operateur) ===== */
.op-hero{max-width:860px;margin:6px auto 16px;padding:20px 24px;background:linear-gradient(135deg,rgba(0,198,174,.12),rgba(15,26,34,.6));border:1px solid var(--line);border-radius:16px;text-align:center}
.op-hero-title{font-size:21px;font-weight:800;letter-spacing:.3px}
.op-hero-sub{font-size:13px;color:var(--mut);margin-top:6px}
.op-wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.op-panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}
.op-h{font-size:13px;letter-spacing:1px;color:var(--mut);font-weight:800;margin:0 0 14px;text-transform:uppercase}
.op-filebar{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.op-fileinput{display:none}
.op-delt{margin-top:14px;display:flex;flex-direction:column;gap:6px;background:rgba(0,198,174,.06);border:1px dashed var(--teal);border-radius:10px;padding:12px 14px}
.op-ok{color:var(--txt);font-size:13.5px}
.op-ok b{color:var(--teal)}
.op-actbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:16px}
.op-analyse{padding:14px 26px;font-size:15px}
.op-hint{color:var(--mut);font-size:12.5px}
.op-status{display:flex;align-items:center;justify-content:center;gap:12px;padding:16px;border-radius:12px;font-size:19px;font-weight:800;margin-bottom:18px}
.op-status-ic{font-size:30px}
.op-orange{background:rgba(255,179,0,.12);color:#ffb300;border:1px solid rgba(255,179,0,.4)}
.op-green{background:rgba(76,175,80,.12);color:#4caf50;border:1px solid rgba(76,175,80,.4)}
.op-red{background:rgba(229,57,53,.12);color:#e53935;border:1px solid rgba(229,57,53,.4)}
.op-idle{background:rgba(120,130,140,.10);color:#8B98A5;border:1px dashed rgba(139,152,165,.5)}
.op-none{background:rgba(120,130,140,.08);border:1px dashed rgba(139,152,165,.4);border-radius:12px;padding:14px;color:#8B98A5;font-size:14px;margin-bottom:14px;text-align:center}
#opResults{display:none}
.op-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.okpi{background:rgba(15,26,34,.5);border:1px solid var(--line);border-radius:12px;padding:16px;text-align:center}
.okpi-lbl{font-size:12.5px;color:var(--mut);margin-bottom:8px}
.okpi-val{font-size:28px;font-weight:800;color:#fff}
.okpi-risk{color:#ffb300}
.okpi-unit{font-size:12px;color:var(--mut);margin-top:4px}
.op-metainfo{margin:12px 0 0;text-align:center;font-size:13px;color:var(--mut);background:rgba(15,26,34,.4);border:1px solid var(--line);border-radius:10px;padding:10px}
.op-threshold{margin-top:10px;text-align:center;font-size:12.5px;color:var(--mut)}
.op-chart{position:relative;height:300px}
.op-chart canvas{display:block;width:100%!important;height:100%!important}
.op-reco{display:flex;gap:14px;align-items:center;background:rgba(255,179,0,.07);border:1px solid rgba(255,179,0,.3);border-radius:12px;padding:16px}
.op-alert{margin-top:14px;display:flex;gap:10px;align-items:center;background:rgba(229,57,53,.10);border:1px solid rgba(229,57,53,.45);border-radius:12px;padding:14px;color:#ff8a80;font-size:14.5px;font-weight:700}
.op-curfile{margin:-8px 0 14px;font-size:12.5px;color:var(--mut);text-align:center}
.op-reco-ic{font-size:30px}
.op-reco-t{font-weight:800;font-size:15px;color:#ffb300}
.op-reco-d{color:var(--txt);font-size:13.5px;margin-top:4px;line-height:1.5}
@media(max-width:760px){.op-wrap{padding:0 6px}.op-hero{padding:16px 14px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
